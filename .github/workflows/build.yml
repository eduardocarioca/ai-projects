name: Build Android APK

on:
  push:
    branches: [ "main", "principal", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: 4. Gerar Estrutura Android Nativa
        run: |
          rm -rf android
          rm -f pubspec.lock
          flutter create . --platforms=android --org=com.example --project-name cam_du_pro
          
          # Configura permissoes de rede no Manifest
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          # Define compileSdk fixo para 34
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle

          # Injeta configuracoes no local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

      - name: 5. Baixar Dependencias
        run: flutter pub get

      - name: 6. Compilar o APK de Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
