name: Build Android APK / AAB

on:
  push:
    branches: [ "main", "principal", "master" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}-flutter-3.24.3
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/android/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install / Configure Android SDK (cli tools)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 34
          # optionally add build-tools or platform-tools components if needed
          # components: "platform-tools,build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: |
          # make sure sdkmanager is in PATH (r0adkll/setup-android should add it)
          yes | sdkmanager --licenses || true

      - name: Detect Android SDK root and compileSdk and export to env
        id: detect_sdk
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then sdkroot="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ]; then sdkroot="$ANDROID_HOME"
          else sdkroot="$HOME/Android/Sdk"
          fi
          echo "SDK root detected: $sdkroot"
          echo "ANDROID_SDK_ROOT=$sdkroot" >> $GITHUB_ENV

          if [ -d "$sdkroot/platforms" ]; then
            max=$(ls "$sdkroot/platforms" 2>/dev/null | sed -E 's/android-([0-9]+)/\1/' | sort -n | tail -n1)
          else
            max=""
          fi

          if [ -z "$max" ]; then
            echo "No Android platforms found; installing android-34..."
            yes | sdkmanager "platforms;android-34" >/dev/null
            max=34
          fi

          echo "Detected/selected compileSdk version: $max"
          echo "COMPILE_SDK_VERSION=$max" >> $GITHUB_ENV

      - name: Create Android project only if missing and adjust compileSdk
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org=com.example --project-name cam_du_pro
          else
            echo "android/ directory exists; skipping flutter create"
          fi

          # inject permissions if file exists
          manifest=android/app/src/main/AndroidManifest.xml
          if [ -f "$manifest" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' "$manifest" || true
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$manifest" || true
          fi

          # update compileSdk in build.gradle files if present
          if [ -f android/app/build.gradle ]; then
            sed -i "s/compileSdk = .*/compileSdk = ${COMPILE_SDK_VERSION}/g" android/app/build.gradle || true
            sed -i "s/compileSdkVersion [0-9]\+/compileSdkVersion ${COMPILE_SDK_VERSION}/g" android/app/build.gradle || true
          fi

          # ensure local.properties points to detected SDK and exposes flutter compile/target versions
          mkdir -p android
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          echo "flutter.compileSdkVersion=${COMPILE_SDK_VERSION}" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=${COMPILE_SDK_VERSION}" >> android/local.properties

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Build Android App Bundle (recommended)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build APK (optional)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload artifacts (AAB + APK)
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
